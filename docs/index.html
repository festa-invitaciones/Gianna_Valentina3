  input, select, textarea, button {
    -webkit-appearance: none;
    appearance: none;

    appearance: checkbox;

  .scroll-progress {

  /* ===== PORTADA ===== */
  .cover {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse at 50% 15%, rgba(181,138,90,0.14) 0%, transparent 55%),
      radial-gradient(ellipse at 12% 88%, rgba(201,175,169,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 88% 85%, rgba(163,137,122,0.06) 0%, transparent 55%),
      linear-gradient(180deg, #ffffff 0%, #FFF9F5 45%, #FCE8EC 100%);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 2rem 1.5rem;
  }

  .cover-corner {
    position: absolute;
    width: clamp(72px, 20vw, 130px);
    height: clamp(72px, 20vw, 130px);
    z-index: 2;
    pointer-events: none;
  }
  .corner-tl { top: 1.4rem; left: 1.2rem; }
  .corner-tr { top: 1.4rem; right: 1.2rem; transform: scaleX(-1); }
  .corner-bl { bottom: 1.4rem; left: 1.2rem; transform: scaleY(-1); }
  .corner-br { bottom: 1.4rem; right: 1.2rem; transform: scale(-1,-1); }

  .cover-emblem { margin-bottom: 0.6rem; }
  .cover-emblem svg { width: 176px; height: 176px; display: block; margin: 0 auto; }

  .candle-flame {
    cursor: pointer;
    transform-origin: 0px -15.2px;
    transform-box: fill-box;
    animation: flameFlicker 2.6s ease-in-out infinite;
    transition: transform 0.15s ease;
  }
  .candle-flame:hover { transform: scale(1.12) rotate(-2deg); }
  .candle-flame.blown { animation: none; opacity: 0; transform: scale(0.2); }
  .candle-flame-glow {
    animation: flameGlow 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  .candle-flame-glow.blown { opacity: 0; }
  @keyframes flameFlicker {
    0%, 100% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.05) rotate(1.5deg); }
    50% { transform: scale(0.96) rotate(-1.5deg); }
    75% { transform: scale(1.03) rotate(1deg); }
  }
  @keyframes flameGlow {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.85; }
  }
  .candle-smoke {
    opacity: 0;
    pointer-events: none;
  }
  .candle-smoke.show {
    animation: smokeRise 1.8s ease-out forwards;
  }
  @keyframes smokeRise {
    0% { opacity: 0.5; transform: translateY(0) scaleX(1); }
    100% { opacity: 0; transform: translateY(-14px) scaleX(1.8); }
  }

  .firefly {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(190,161,150,0.5);
    box-shadow: 0 0 8px 3px rgba(190,161,150,0.2), 0 0 20px 6px rgba(190,161,150,0.08);
    animation: fly linear infinite;
    pointer-events: none;
  }

  @keyframes fly {
    0%   { transform: translate(0,0) scale(1);   opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translate(var(--dx), var(--dy)) scale(0.7); opacity: 0.6; }
    90%  { opacity: 0.4; }
    100% { transform: translate(var(--dx2), var(--dy2)) scale(1.2); opacity: 0; }
  }

  .cover-inner {
    position: relative; z-index: 2;
    text-align: center;
    animation: fadeInUp 1.2s ease forwards;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .cover-name {

    font-weight: 400;
    color: var(--blue-dark);
    text-shadow: 0 2px 24px rgba(163,137,122,0.08);

  /* ===== RESTO DE SECCIONES ===== */

    flex-direction: column;

  .divider {

  .diamond-deco {

  .floral-divider {

    justify-content: center;

  .quote-section {
    background: 
      radial-gradient(ellipse at 50% 50%, rgba(163,137,122,0.06) 0%, transparent 70%),

  .quote-text {

  .photo-single {
    width: 100%;
    max-width: 360px;

  }

  .photo-single::before {

  .photo-single .photo-frame {

  .when-section { background: var(--cream); }

  .anim-icon { cursor: pointer; display: block; margin: 0 auto 1.5rem; }

  .cal-body { transform-origin: 56px 56px; transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); }
  .when-section:hover .cal-body, .when-section.tapped .cal-body { transform: scale(1.08); }
  .cal-ring { transform-origin: center; animation: calRing 3s ease-in-out infinite; }
  @keyframes calRing {
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
  }
  .cal-date-num { animation: calPop 0.6s ease forwards; opacity: 0; }
  @keyframes calPop { to { opacity: 1; transform: scale(1); } from { opacity: 0; transform: scale(0.5); } }
  .cal-dot { animation: dotBlink 1.8s ease-in-out infinite; }
  .cal-dot:nth-child(2){ animation-delay: 0.2s; }
  .cal-dot:nth-child(3){ animation-delay: 0.4s; }
  @keyframes dotBlink { 0%,100%{opacity:0.2} 50%{opacity:1} }

  .pin-drop { animation: pinBounce 2.5s ease-in-out infinite; transform-origin: 28px 48px; }
  @keyframes pinBounce {
    0%,100%{ transform: translateY(0) scale(1); }

  }
  .pin-pulse { animation: pinPulse 2.5s ease-in-out infinite; transform-origin: 28px 48px; opacity: 0; }
  @keyframes pinPulse {
    0%,100%{ transform: scale(0.5); opacity: 0; }

  }
  .where-section:hover .pin-drop { animation-play-state: paused; transform: translateY(-10px) scale(1.1); }

  .diamond-anim { animation: diamondSpin 2.5s ease-in-out infinite; transform-origin: 50px 50px; }
  @keyframes diamondSpin {
    0%{ transform: rotate(-4deg) scale(1); }
    25%{ transform: rotate(0deg) scale(1.06); }
    50%{ transform: rotate(4deg) scale(1); }
    75%{ transform: rotate(0deg) scale(1.06); }
    100%{ transform: rotate(-4deg) scale(1); }
  }
  .diamond-shimmer { animation: shimmerSlide 1.8s ease-in-out infinite; }
  @keyframes shimmerSlide {
    0%{ opacity:0; transform: translateX(-20px) skewX(-10deg); }
    30%{ opacity:0.9; }
    60%{ opacity:0; transform: translateX(20px) skewX(-10deg); }
    100%{ opacity:0; }
  }
  .dresscode-section:hover .diamond-anim { animation-play-state: paused; transform: scale(1.12); }

  .chat-bub1 { animation: bubFloat1 3s ease-in-out infinite; }
  .chat-bub2 { animation: bubFloat2 3s ease-in-out infinite 0.4s; }
  @keyframes bubFloat1 {
    0%,100%{ transform: translateY(0) rotate(-3deg); }
    50%{ transform: translateY(-5px) rotate(-3deg); }
  }
  @keyframes bubFloat2 {
    0%,100%{ transform: translateY(0) rotate(4deg); }

  .chat-star { animation: starSpin 4s linear infinite; transform-origin: 22px 20px; }

  .chat-dots span { display: inline-block; animation: dotJump 1.2s ease-in-out infinite; }

  @keyframes dotJump { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }

  .gift-lid { animation: giftLidBounce 0.9s ease-in-out infinite; transform-origin: 40px 26px; }
  @keyframes giftLidBounce {

  .gift-ribbon-h { animation: ribbonPulse 0.9s ease-in-out infinite; transform-origin: 40px 50px; }

  .gift-sparkle:nth-child(2){ animation-delay: 0.3s; }
  .gift-sparkle:nth-child(3){ animation-delay: 0.6s; }
  @keyframes sparklePop {

  .gifts-section:hover .gift-lid { transform: translateY(-12px) rotate(-10deg); transition: transform 0.25s ease; animation: none; }

  .rsvp-section:hover .envelope-body { animation: none; transform: rotate(0deg) translateY(-4px); transition: transform 0.3s ease; }
